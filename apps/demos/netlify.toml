# Netlify config for the FlowDrop demos site.
#
# Single site, two artifacts under one domain:
#   /            → the demos hub (this SvelteKit app, adapter-static)
#   /storybook   → the library's Storybook, built from libs/flowdrop source
#
# In the Netlify UI set the site's **Base directory** to `apps/demos` and point
# it at this file. The build below `cd`s up to the repo root for the Storybook
# step, then copies its static output into this app's build dir so both ship
# from one publish directory.
#
# Why two package managers' worth of installs: this repo is NOT a pnpm
# workspace — each app installs independently. The demos app consumes the
# PUBLISHED @flowdrop/flowdrop from npm (stable), while Storybook builds from
# the LOCAL libs/flowdrop source (always current). That split is intentional.

[build]
  base = "apps/demos"
  publish = "build"
  # The demos step uses npm deliberately: npm reads package.json (the pinned,
  # published @flowdrop/flowdrop) and ignores pnpm-lock.yaml, so the deploy is
  # immune to a developer's local `pnpm link` to libs/flowdrop. The Storybook
  # step uses pnpm against local source — that's the point of it.
  #
  # `npm ci` (not `npm install`): the committed package-lock.json pins the
  # published deps, so npm reifies a fixed tree instead of rebuilding it from
  # scratch each deploy. That from-scratch resolution tripped npm 10's arborist
  # `edgesOut` crash on Netlify; `npm ci` sidesteps it and is reproducible.
  # IMPORTANT: regenerate package-lock.json in a CLEAN checkout (NOT while
  # libs/flowdrop is pnpm-linked, which injects unparseable `link:` deps)
  # whenever this app's deps change.
  command = """
    npm ci &&
    npm run build &&
    (cd ../../libs/flowdrop && pnpm install --frozen-lockfile=false && pnpm run storybook:build) &&
    mkdir -p build/storybook &&
    cp -r ../../libs/flowdrop/storybook-static/. build/storybook/
  """

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: client-only routes (the editor mounts in the browser) resolve
# to the prerendered shell on a hard refresh / direct link.
# Prerendered API endpoints are written as extensionless files; serve them as
# JSON so they're inspectable (the library's fetch parses regardless).
[[headers]]
  for = "/api/flowdrop/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
  # Don't shadow prerendered routes (incl. /api/flowdrop/*) or the Storybook subtree.
  force = false
