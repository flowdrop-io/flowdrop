# Session Endpoints
# One session's own HTTP surface, independent of the client that created it.
# Servers that predate it serve the same calls under /playground/sessions/*
# (see playground.yaml); clients choose with the `sessions` endpoint group.
# Listing and creating sessions for a workflow stay under
# /workflows/{id}/playground/sessions.

/sessions/{sessionId}:
  get:
    operationId: getSession
    summary: Get session details
    description: The session, its status and its executions.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Session details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/playground.yaml#/PlaygroundSessionResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    operationId: deleteSession
    summary: Delete a session
    description: Permanently delete a session and all its messages.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Session deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

/sessions/{sessionId}/messages:
  get:
    operationId: listSessionMessages
    summary: Page a session's messages
    description: |
      Same query parameters and response as
      `GET /playground/sessions/{sessionId}/messages`: `since` (forward
      cursor, polling), `before` (backward cursor, scroll-up), `latest`
      (newest page) and `limit`.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: before
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: latest
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: A page of messages
        content:
          application/json:
            schema:
              $ref: '../components/schemas/playground.yaml#/PlaygroundMessagesResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

/sessions/{sessionId}/runs:
  get:
    operationId: listSessionRuns
    summary: List the runs a session started
    description: |
      The session's runs, oldest first, each stamped with the workflow version
      it ran and its named inputs, bounded. `data.workflowVersion` is the
      session's workflow as it is now (null when the workflow is gone); a run's
      `workflowVersion` is null for a run the server did not stamp. A client
      compares the two to tell a run that is stale: an unknown version is never
      stale. Versions are opaque strings, compared for equality only.
      Optional: a server without it answers 404 and the editor shows no version
      dividers (`sessions.runs` in the endpoint config).
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The newest this many runs (still returned oldest first)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: The session's runs
        content:
          application/json:
            schema:
              $ref: '../components/schemas/playground.yaml#/SessionRunsResponse'
      '403':
        description: Access denied
      '404':
        $ref: '../components/responses.yaml#/NotFound'

/sessions/{sessionId}/turn:
  post:
    operationId: takeSessionTurn
    summary: Take a turn
    description: |
      Post the person's message and/or named inputs and run the session's
      workflow on them. Answers 202 with a turn result, not the user's message
      row (which `POST /playground/sessions/{sessionId}/messages` returns); the
      row arrives through the messages endpoint.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/playground.yaml#/PlaygroundMessageRequest'
          examples:
            chat:
              summary: A chat turn
              value:
                content: Hello, can you help me analyze this data?
            form:
              summary: A form-only workflow's turn
              value:
                inputs:
                  topic: cats
    responses:
      '202':
        description: Turn accepted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/playground.yaml#/SessionTurnResponse'
      '400':
        description: |
          Malformed body, inputs the workflow does not declare, or `content`
          sent to a workflow with no `message` port (the message names the fix).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: A turn is already running, or the session has no workflow
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/sessions/{sessionId}/stop:
  post:
    operationId: stopSessionTurn
    summary: Stop the running turn
    description: Cancels the session's running pipeline and sets the session idle.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Stopped
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: No turn is running
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/sessions/{sessionId}/reset:
  post:
    operationId: resetSession
    summary: Reset a stuck session to idle
    description: |
      Cancels pending messages and clears interrupt state. Optional: a server
      without it omits the path, and clients leave `sessions.reset` unset.
    tags:
      - Sessions
    parameters:
      - name: sessionId
        in: path
        description: Session UUID
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Reset
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ApiResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
