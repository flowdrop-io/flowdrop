# Workflow Schemas
# Workflow, nodes, edges, and related types

WorkflowNode:
  type: object
  description: |
    Represents a node instance in a workflow.

    Each node instance contains:
    - Position on the canvas
    - Display data (label)
    - Configuration values (config) - user-defined settings
    - Metadata from the node type definition
    - Optional execution state and extensions
  properties:
    id:
      type: string
      format: uuid
      description: Node instance UUID
    type:
      type: string
      description: Node type ID (references NodeMetadata.node_type_id)
      example: calculator
    position:
      $ref: './common.yaml#/Position'
    deletable:
      type: boolean
      default: true
    data:
      type: object
      properties:
        label:
          type: string
          description: Node instance label
          example: Math Calculator
        config:
          $ref: './node.yaml#/NodeConfig'
        metadata:
          $ref: './node.yaml#/NodeMetadata'
        isProcessing:
          type: boolean
          description: Whether the node is currently processing
        error:
          type: string
          description: Error message if node execution failed
        executionInfo:
          $ref: './node.yaml#/NodeExecutionInfo'
        extensions:
          $ref: './node.yaml#/NodeExtensions'
          description: |
            Per-instance extension properties for 3rd party integrations.
            Overrides or extends the node type extensions defined in metadata.extensions.
            Use for instance-specific UI states or custom data.

            Common use cases:
            - `extensions.ui.style`: Custom styling for this node instance
            (Port order + exposure live in `config.ports`, not here.)
      required:
        - label
        - config
        - metadata
  required:
    - id
    - type
    - position
    - data

WorkflowEdge:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Edge UUID
    source:
      type: string
      format: uuid
      description: Source node UUID
    target:
      type: string
      format: uuid
      description: Target node UUID
    sourceHandle:
      type: string
      description: Source port ID
    targetHandle:
      type: string
      description: Target port ID
    type:
      type: string
      description: Connection line type
      enum:
        - default
        - straight
        - step
        - smoothstep
    selectable:
      type: boolean
      default: true
    deletable:
      type: boolean
      default: true
    data:
      type: object
      properties:
        label:
          type: string
          description: Edge label
        condition:
          type: string
          description: Conditional expression for conditional edges
        metadata:
          type: object
          description: Edge metadata for API and persistence
          properties:
            edgeType:
              type: string
              enum:
                - trigger
                - tool
                - data
              description: Edge type for visual styling
            sourcePortDataType:
              type: string
              description: Data type of the source output port (e.g., tool, string, number)
        isToolConnection:
          type: boolean
          description: Whether this is a tool connection (deprecated, use metadata.edgeType instead)
        targetNodeType:
          type: string
          description: Target node type
        targetCategory:
          type: string
          description: Target node category
  required:
    - id
    - source
    - target

WorkflowMetadata:
  type: object
  properties:
    schemaVersion:
      type: string
      description: Workflow schema format version — identifies the document format, not the workflow's own revision.
      example: '1.0.0'
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
    author:
      type: string
      description: Workflow author
      example: admin
    tags:
      type: array
      items:
        type: string
      description: Workflow tags
      example:
        - ai
        - production
    versionId:
      type: string
      description: Version control ID
    updateNumber:
      type: integer
      description: Update sequence number
    format:
      type: string
      description: |
        Workflow format identifier. Determines which node types are shown
        in the sidebar and how the workflow is exported.
        Built-in formats: 'flowdrop' (default), 'agentspec'.
        Custom formats can be registered via WorkflowFormatRegistry.
      example: flowdrop
      default: flowdrop
  required:
    - schemaVersion
    - createdAt
    - updatedAt

PortBinding:
  type: object
  description: |
    A resolved pointer to one inner node port, used by `WorkflowInterfaceEntry.bindings`.
  properties:
    nodeId:
      type: string
      format: uuid
      description: Node instance UUID (references `WorkflowNode.id`)
    portId:
      type: string
      description: Port ID on that node (references a `NodePort.id` in the node's metadata)
  required:
    - nodeId
    - portId

WorkflowInterfaceEntry:
  type: object
  description: |
    One entry in a workflow's public contract (see `WorkflowInterface`). Owns its own
    identity: `id` is stable and unique within its direction (inputs and outputs are
    scoped separately), independent of whichever inner port it currently binds to —
    swapping or renaming a node does not silently break callers.

    On export toward a server manifest the entry's `id` maps to the manifest's `name`
    — the server's wire identity. Renaming an `id` is therefore a breaking change for
    callers, not a cosmetic one.

    Every entry — input or output — must resolve to exactly one binding; more than
    one is reported as `over-bound`. An empty `bindings` list is a valid *draft*
    state, reported as `unbound`.
  properties:
    id:
      type: string
      description: Stable public name. Unique within its direction (inputs vs outputs).
      example: customerName
    name:
      type: string
      description: Display label for callers and UI. Defaults to `id` when absent.
    description:
      type: string
      description: Help text describing what this entry represents to external callers.
    dataType:
      $ref: './common.yaml#/NodeDataType'
      description: |
        The port's LANE — what it is and what it may connect to — not the JSON
        Schema type of its value, which is `schema.type`. The two vocabularies
        overlap on `string`/`number`/`boolean`/`array` and diverge where it
        matters: a `messages` port is a JSON `array`, an `error` port a JSON
        `object`. Derived by the server from the bound inner port and ignored
        on write.
    required:
      type: boolean
      description: Whether callers must supply a value. Inputs only; ignored on outputs.
    defaultValue:
      description: Default value used when no external value is supplied. Inputs only.
    examples:
      type: array
      items: {}
      description: |
        Example values a caller could supply — author metadata for documentation
        and launch forms, mirroring the server manifest's `examples`. Inputs
        only; ignored on outputs. Never validated against `schema`.
    schema:
      $ref: './node.yaml#/PortDataSchema'
      description: |
        The JSON Schema fragment for this one port — a single property's
        schema (`{"type": "array"}`), not a whole object schema. Carries the
        structural contract only: whatever the entry states itself (the lane,
        `name`, `description`, `examples`, `required`) is not repeated inside
        it. Derived by the server from the bound inner port and ignored on
        write; absent when the bound port declares no structural contract.
    bindings:
      type: array
      items:
        $ref: '#/PortBinding'
      description: |
        Inner ports this entry maps to. Every entry must resolve to exactly one
        binding; more than one is reported as `over-bound` (the list shape is kept
        so input fan-out can become additive later). An empty list is a valid
        draft state, reported as `unbound`. The bound port must also be
        canvas-exposed (see `NodePort.exposedByDefault` / `config.ports`) — a
        bound-but-hidden port is reported as `hidden`.
    meta:
      type: object
      additionalProperties: true
      description: |
        Opaque consumer metadata. The library never reads or interprets this field
        — it round-trips verbatim on every read/write. Servers use it to say what
        "external" means for them, e.g. `{"http": {"in": "query"}}` or
        `{"mcp": {"toolParam": true}}`.

        Keys under the `fd.` prefix are reserved for future library use — consumers
        must not write keys starting with `fd.`.

        One exception, owned by `turn`: on a `history` entry, `limit` (a positive
        integer, default 10) is how many past user and assistant messages the
        session fills the port with. The interface editor writes that one key.
    turn:
      $ref: '#/WorkflowInterfaceTurn'
      deprecated: true
      description: |
        **Deprecated** since 2.11.0, removed in 3.0: the chat binding now lives in
        the workflow's `playground` settings. Still accepted and round-tripped; a
        workflow without stored Playground settings falls back to it.

        What this port is for in a chat turn. Absent means the port plays no part
        in a turn. Validated by the server against its vocabulary.
  required:
    - id
    - dataType
    - bindings

WorkflowInterfaceTurn:
  deprecated: true
  type: string
  enum:
    - message
    - history
    - session_id
    - message_id
    - reply
  description: |
    **Deprecated** since 2.11.0, removed in 3.0 (see `WorkflowPlayground`).

    The chat-turn vocabulary of an interface port.

    Inputs — at most one entry per value:
    - `message` — the person's message (the turn's content), a string
    - `history` — past user and assistant messages, bounded by `meta.limit`
      (default 10)
    - `session_id` — the session's id
    - `message_id` — the id of the person's message

    Outputs — any number:
    - `reply` — each value becomes one assistant message

PlaygroundReplyPort:
  type: object
  description: A node output port whose value prints as an assistant reply.
  properties:
    node_id:
      type: string
      description: Id of the node.
      example: chat_output.2
    port:
      type: string
      description: Id of the node's output port.
      example: message
  required:
    - node_id
    - port

PlaygroundChatHistory:
  type: object
  description: The interface input that receives recent messages.
  properties:
    input:
      type: string
      description: Interface input entry id.
    limit:
      type: integer
      minimum: 1
      description: How many past user and assistant messages fill the input. The server enforces its own maximum.
      example: 10
  required:
    - input
    - limit

PlaygroundChatBinding:
  type: object
  description: |
    A workflow's chat binding: which interface inputs a chat turn fills and which
    node output ports print as replies. Inputs are named by interface entry id,
    replies by node id and output port id.
  properties:
    message:
      type: string
      nullable: true
      description: Interface input that receives the person's message.
    history:
      allOf:
        - $ref: '#/PlaygroundChatHistory'
      nullable: true
      description: Interface input that receives recent messages.
    session_id:
      type: string
      nullable: true
      description: Interface input that receives the session's id.
    message_id:
      type: string
      nullable: true
      description: Interface input that receives the id of the person's message.
    replies:
      type: array
      items:
        $ref: '#/PlaygroundReplyPort'
      description: Node output ports whose values print as assistant messages.
    sub_workflow_replies:
      type: boolean
      description: Whether replies from sub-workflows print too.
  required:
    - replies

WorkflowPlayground:
  type: object
  description: |
    Playground settings of a workflow (FlowDrop 2.7.0 and later). Sent with every
    workflow read. On save the client sends only `{"chat": ...}`: `chat: null`
    clears the stored settings, and a request without the `playground` key
    leaves them alone. The server answers 422 with problems for an invalid
    binding.
  properties:
    chat:
      allOf:
        - $ref: '#/PlaygroundChatBinding'
      nullable: true
      description: The stored chat binding; null when none is stored.
    resolved:
      allOf:
        - $ref: '#/PlaygroundChatBinding'
      description: The binding in effect (never null); read-only, ignored on save.
    source:
      type: string
      description: |
        Where the binding in effect comes from: `settings`, `interface_turn`
        (the deprecated interface `turn` annotations) or `none`. Clients should
        tolerate other values. Read-only, ignored on save.

WorkflowInterface:
  type: object
  description: |
    A workflow's public contract: named inputs/outputs that external callers supply
    or receive, each pointing at an inner node port via a binding. Array order is
    the caller-facing order. Absent on a `Workflow` means the workflow declares no
    interface, not an empty one.
  properties:
    inputs:
      type: array
      items:
        $ref: '#/WorkflowInterfaceEntry'
      description: Named inputs external callers supply.
    outputs:
      type: array
      items:
        $ref: '#/WorkflowInterfaceEntry'
      description: Named outputs external callers receive.

Workflow:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Workflow UUID
    name:
      type: string
      description: Workflow name
      example: My AI Workflow
      maxLength: 200
    description:
      type: string
      description: Workflow description
      maxLength: 1000
    nodes:
      type: array
      items:
        $ref: '#/WorkflowNode'
      description: Workflow nodes
    edges:
      type: array
      items:
        $ref: '#/WorkflowEdge'
      description: Workflow edges
    metadata:
      $ref: '#/WorkflowMetadata'
    config:
      type: object
      description: Custom workflow-level configuration values. Populated when a workflowSettingsSchema is provided to the editor.
      additionalProperties: true
    interface:
      $ref: '#/WorkflowInterface'
      description: Public contract for callers. Absent = the workflow declares no interface.
    playground:
      $ref: '#/WorkflowPlayground'
      description: Playground settings (the chat binding). Absent = the server predates them (before FlowDrop 2.7.0).
  required:
    - id
    - name
    - nodes
    - edges
    - metadata

CreateWorkflowRequest:
  type: object
  properties:
    name:
      type: string
      description: Workflow name
      minLength: 1
      maxLength: 200
      example: My First Workflow
    description:
      type: string
      description: Workflow description
      maxLength: 1000
    nodes:
      type: array
      items:
        $ref: '#/WorkflowNode'
    edges:
      type: array
      items:
        $ref: '#/WorkflowEdge'
    playground:
      $ref: '#/WorkflowPlayground'
      description: 'Playground settings. Send only `chat`: null clears the stored settings, and omitting the key leaves them alone.'
    tags:
      type: array
      items:
        type: string
        maxLength: 50
      maxItems: 20
  required:
    - name

UpdateWorkflowRequest:
  type: object
  properties:
    name:
      type: string
      description: Workflow name
      minLength: 1
      maxLength: 200
    description:
      type: string
      description: Workflow description
      maxLength: 1000
    nodes:
      type: array
      items:
        $ref: '#/WorkflowNode'
    edges:
      type: array
      items:
        $ref: '#/WorkflowEdge'
    playground:
      $ref: '#/WorkflowPlayground'
      description: 'Playground settings. Send only `chat`: null clears the stored settings, and omitting the key leaves them alone.'
    metadata:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        author:
          type: string
          maxLength: 100
