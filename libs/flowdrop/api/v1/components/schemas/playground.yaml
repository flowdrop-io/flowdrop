# Playground Schemas
# Playground session, message, and related types

PlaygroundSessionStatus:
  type: string
  enum:
    - idle
    - running
    - awaiting_input
    - completed
    - failed
  description: Current status of a playground session

PlaygroundMessageRole:
  type: string
  enum:
    - user
    - assistant
    - system
    - log
  description: |
    Role of the message sender:
    - `user`: Message from the user
    - `assistant`: Response from the workflow/AI
    - `system`: System notifications
    - `log`: Execution log entries

PlaygroundMessageLevel:
  type: string
  enum:
    - info
    - warning
    - error
    - debug
  description: Log level for log-type messages

PlaygroundMessageStatus:
  type: string
  enum:
    - pending
    - processing
    - completed
    - failed
  description: |
    Processing status of the message:
    - `pending`: Message created, waiting to be processed
    - `processing`: Message is currently being processed
    - `completed`: Message processing completed successfully
    - `failed`: Message processing failed

PlaygroundSession:
  type: object
  description: |
    A playground session represents an isolated test environment for a workflow.
    Sessions maintain conversation history and allow interactive testing.
  properties:
    id:
      type: string
      format: uuid
      description: Session unique identifier
    workflowId:
      type: string
      format: uuid
      description: Associated workflow ID
    name:
      type: string
      description: Session display name
      example: Test Session 1
    status:
      $ref: '#/PlaygroundSessionStatus'
    createdAt:
      type: string
      format: date-time
      description: Session creation timestamp
    updatedAt:
      type: string
      format: date-time
      description: Last activity timestamp
    executions:
      type: array
      description: |
        Main pipeline runs triggered within this session, ordered oldest-first.
        Sub-flow (nested) executions are intentionally excluded — they are
        surfaced only on individual messages via `parentPipelineId`. Clients rely
        on this list being main-runs-only to populate the run-switcher.
      items:
        $ref: '#/PlaygroundExecution'
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      description: Custom session metadata
  required:
    - id
    - workflowId
    - name
    - status
    - createdAt
    - updatedAt

PlaygroundExecution:
  type: object
  description: A single pipeline execution associated with a playground session
  properties:
    id:
      type: string
      description: Pipeline/execution ID
    startedAt:
      type: string
      format: date-time
      description: When the execution started
    status:
      type: string
      enum: [running, completed, failed]
      description: Current execution status
  required:
    - id
    - startedAt
    - status

MessageHierarchyItem:
  type: object
  description: |
    A single node on a message's hierarchy path. Rendered in document order
    separated by chevrons. Display-only — this is not a navigation breadcrumb.
  properties:
    id:
      type: string
      description: Stable identifier (used for keying)
    label:
      type: string
      description: Display label
    icon:
      type: string
      description: Optional iconify icon id (e.g. "mdi:graph")
  required:
    - id
    - label

MessageTagColor:
  type: string
  enum:
    - muted
    - primary
    - success
    - warning
    - error
    - info
  description: Semantic color hook for a MessageTag

MessageTagVariant:
  type: string
  enum:
    - subtle
    - solid
    - outline
  description: Visual emphasis style for a MessageTag

MessageTag:
  type: object
  description: |
    A server-emitted classification chip rendered alongside a message.
    When a message specifies tags, the client renders exactly those —
    no client-side synthesis or augmentation.
  properties:
    id:
      type: string
      description: Stable identifier (used for keying)
    label:
      type: string
      description: Display label
    icon:
      type: string
      description: Optional iconify icon id
    color:
      $ref: '#/MessageTagColor'
      description: Defaults to "muted" if omitted
    variant:
      $ref: '#/MessageTagVariant'
      description: Defaults to "subtle" if omitted
    type:
      type: string
      description: |
        Free-form classifier the server may use for future grouping or
        filtering. The client treats this as opaque metadata.
  required:
    - id
    - label

PlaygroundMessageDisplay:
  type: string
  enum:
    - default
    - bubble
    - log
    - notice
    - card
    - hidden
  description: |
    Layout hint chosen by the server. When omitted (or `default`), the
    client defaults from the role:
    - `log` → `log`
    - `system` (with compactSystemMessages enabled) → `notice`
    - everything else → `bubble`

    Layouts:
    - `default` — no hint; same as omitting the field
    - `bubble` — chat bubble with avatar, header, body, optional footer
      containing hierarchy + tags
    - `log` — one-liner: icon · hierarchy · body · tags · timestamp
    - `notice` — compact centered notice
    - `card` — vertical: hierarchy (top), body (middle), tags (bottom)
    - `hidden` — not rendered by default. Hidden is not private: the row
      is still delivered with the rest of the session. It hides noise,
      never secrets.

PlaygroundMessageOrigin:
  type: string
  enum:
    - user
    - workflow
    - engine
    - playground
    - interrupt
  description: |
    Which component posted the message — the axis beside `role` (who spoke,
    conversationally) and `display` (how to render it).
    - `user` — a person typed it
    - `workflow` — the workflow produced it (a reply)
    - `engine` — the run machinery wrote it (trigger rows, failures,
      recovery, reporting rows)
    - `playground` — a console observer wrote it for its own viewers
    - `interrupt` — the interrupt system posted a question into the session

    Servers that predate the field omit it; clients treat that as unknown.

PlaygroundMessage:
  type: object
  description: |
    A message in a playground session. Messages can be user inputs,
    assistant responses, system notifications, or execution logs.
  properties:
    id:
      type: string
      format: uuid
      description: Message unique identifier
    sessionId:
      type: string
      format: uuid
      description: Parent session ID
    role:
      $ref: '#/PlaygroundMessageRole'
    content:
      type: string
      description: Message content
    timestamp:
      type: string
      format: date-time
      description: Message timestamp
    status:
      $ref: '#/PlaygroundMessageStatus'
    sequenceNumber:
      type: integer
      description: |
        Incrementing sequence number for chronological ordering within a session.
        All messages (user, assistant, log) receive incrementing numbers (1, 2, 3, ...).
        Use this as the primary sort key for displaying messages in order.
      minimum: 1
    parentMessageId:
      type: string
      format: uuid
      description: Parent message ID (for linking user message to assistant response)
      nullable: true
    executionId:
      type: string
      description: Workflow execution ID that generated this message
      nullable: true
    parentPipelineId:
      type: string
      description: |
        Execution ID of the parent pipeline when this message was produced by a
        nested sub-flow. `null` for top-level (main pipeline) messages. Unlike
        the display-only `hierarchy`, this is an authoritative nesting signal:
        clients use it to keep the main pipeline in focus and exclude sub-flow
        runs from the run-switcher.
      nullable: true
    rootPipelineId:
      type: string
      description: |
        Execution ID of the top-level pipeline this message ultimately belongs
        to. Equal to `executionId` for main-pipeline messages; for sub-flow
        messages it points to the main run that triggered the sub-flow.
      nullable: true
    nodeId:
      type: string
      description: Associated node ID (for log messages)
      nullable: true
    hierarchy:
      type: array
      description: |
        Ordered hierarchy path describing where this message sits (e.g.
        workflow > sub-workflow > iteration). Display-only; rendered as a
        chevron-separated trail. The server decides the depth and content.
      items:
        $ref: '#/MessageHierarchyItem'
    tags:
      type: array
      description: |
        Server-emitted classification chips. When present, the client
        renders exactly these tags — there is no client-side synthesis.
      items:
        $ref: '#/MessageTag'
    display:
      $ref: '#/PlaygroundMessageDisplay'
      description: |
        Optional layout hint. When omitted, the client picks a default
        based on the message role.
    origin:
      $ref: '#/PlaygroundMessageOrigin'
      description: |
        Which component posted the message. Always present on current
        servers; absent from older ones.
    metadata:
      type: object
      properties:
        level:
          $ref: '#/PlaygroundMessageLevel'
        duration:
          type: integer
          description: Execution duration in milliseconds
        nodeLabel:
          type: string
          description: Human-readable node label
        outputs:
          type: object
          additionalProperties: true
          description: Node output data
      additionalProperties: true
      description: Additional message metadata
  required:
    - id
    - sessionId
    - role
    - content
    - timestamp
    - status
    - sequenceNumber
  example:
    id: be4d854d-d6b3-4242-b2ea-0008b2e059bd
    sessionId: fe5304ea-f069-433f-b0bf-945975c0b806
    role: user
    content: Hello. How are you?
    timestamp: '2026-01-19T10:03:32+01:00'
    status: completed
    sequenceNumber: 1
    parentMessageId: null
    nodeId: null
    metadata: {}

PlaygroundInputField:
  type: object
  description: |
    Input field derived from workflow input nodes.
    Used to auto-generate input forms in the playground.
  properties:
    nodeId:
      type: string
      description: Source node ID
    fieldId:
      type: string
      description: Field identifier
    label:
      type: string
      description: Display label
    type:
      type: string
      description: Field data type
    defaultValue:
      description: Default value from node config
    required:
      type: boolean
      description: Whether the field is required
    schema:
      $ref: './config.yaml#/ConfigProperty'
      description: JSON Schema for the field
  required:
    - nodeId
    - fieldId
    - label
    - type
    - required

PlaygroundMessageRequest:
  type: object
  description: |
    Request body for a turn: the person's message, named inputs, or both.

    `content` fills the interface input named by the workflow's chat binding
    (`playground.resolved.message`). A workflow whose binding has no message
    input is form-only: it runs on `inputs` alone and the server refuses
    `content` with a 400 whose message names the fix. A workflow with no
    binding at all keeps the server's older behaviour (deprecated) and still
    needs `content`.
  properties:
    content:
      type: string
      description: The person's message
      maxLength: 10000
    inputs:
      type: object
      additionalProperties: true
      description: |
        Named inputs, keyed by interface entry name. Ports with a `turn` are
        filled by the session and are not sent here.

SessionTurnResult:
  type: object
  description: |
    Snapshot of a turn at the moment the request returned. The user's row,
    the assistant rows and later status changes arrive through the messages
    endpoint like those of any other turn.
  properties:
    sessionId:
      type: string
    userMessageId:
      type: string
      description: Id of the user's message row; also the turn's id
    pipelineId:
      type: string
      nullable: true
      description: The pipeline running the turn; null until it exists (queued turns)
    status:
      type: string
      enum: [queued, running, completed, awaiting_input, paused, failed]
    assistantMessageIds:
      type: array
      items:
        type: string
      description: Assistant rows written during the turn; filled only when the server waited
    finalAssistantMessageId:
      type: string
      nullable: true
    finalAssistantMessage:
      type: string
      nullable: true
    artifacts:
      type: array
      items:
        type: object
        additionalProperties: true
  required:
    - sessionId
    - userMessageId
    - pipelineId
    - status

SessionTurnResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          $ref: '#/SessionTurnResult'

PlaygroundSessionResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          $ref: '#/PlaygroundSession'

PlaygroundSessionsResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/PlaygroundSession'

PlaygroundMessageResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          $ref: '#/PlaygroundMessage'

PlaygroundMessagesResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/PlaygroundMessage'
        hasMore:
          type: boolean
          description: |
            Whether more recent messages remain after this page (forward
            pagination via `since`).
        hasOlder:
          type: boolean
          description: |
            Whether older messages exist before the first message in this page.
            Set on `latest`/`before` (backward pagination) responses so a chat
            surface knows whether to keep loading on scroll-up.
        sessionStatus:
          $ref: '#/PlaygroundSessionStatus'
          description: Current session status (useful for polling)
